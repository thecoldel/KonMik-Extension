<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KonMik Extension Library</title>
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: { primary: '#FF7A00' }
                }
            }
        }
    </script>
    <style>
        .bg-grid {
            background-size: 40px 40px;
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .animated-gradient-text {
            background: linear-gradient(270deg, #FF7A00, #ffbb77, #ff4500, #FF7A00);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientMove 6s ease infinite;
        }

        .glow-bg {
            position: absolute;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(255, 122, 0, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            z-index: -1;
            filter: blur(70px);
            pointer-events: none;
        }

        /* Kartu dengan efek gradien warna di background saat hover */
        .ext-card {
            background: rgba(18, 18, 22, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 1rem;
            position: relative;
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .ext-card::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 1rem;
            background: linear-gradient(135deg, rgba(255, 122, 0, 0.25), rgba(59, 130, 246, 0.15), transparent 70%);
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 0;
            pointer-events: none;
        }

        .ext-card:hover::after {
            opacity: 1;
        }

        .ext-card:hover {
            border-color: rgba(255, 122, 0, 0.5);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px -10px rgba(255, 122, 0, 0.2);
        }

        .ext-content {
            position: relative;
            z-index: 1;
        }

        /* Tombol Gradien Copy URL */
        .btn-gradient-copy {
            background: linear-gradient(135deg, #3b82f6 0%, #ec4899 100%);
            color: white;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }
        .btn-gradient-copy:hover {
            opacity: 0.9;
            transform: scale(1.01);
        }

        /* Tombol Source */
        .btn-source {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #e4e4e7;
            transition: all 0.2s ease;
        }
        .btn-source:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
